[package]
name = "qefro-backend-sdk"
version = "1.2.0"
edition = "2021"
description = "Qefro backend framework for business tool handlers and customer authorization orchestration"
license = "MIT"
readme = "README.md"
homepage = "https://docs.qefro.com/docs/guides/register-sdk-business-tools"
repository = "https://github.com/qefro-ai/qefro-rust-backend-sdk"
documentation = "https://docs.rs/qefro-backend-sdk"
keywords = ["qefro", "ai", "sdk", "business-tools", "customer-support"]
categories = ["web-programming", "api-bindings"]
rust-version = "1.70"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "signal"] }
tower = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }

[[example]]
name = "basic"
path = "examples/basic/main.rs"
